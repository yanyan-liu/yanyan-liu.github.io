<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Website</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: #333;
            background-color: #f9f9f9;
        }
        /* Header Menu Styling */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
            padding: 20px 0;
            margin-bottom: 40px;
        }
        nav {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .site-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: #222;
            text-decoration: none;
        }
        .menu-link {
            text-decoration: none;
            color: #0366d6;
            font-weight: 500;
            margin-left: 20px;
        }
        .menu-link:hover {
            text-decoration: underline;
        }
        /* Main Content Styling */
        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #222;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 40px;
        }
        .content-placeholder {
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: left;
        }
    </style>
</head>
<body>

    <!-- Header Menu -->
    <header>
        <nav>
            <a href="#" class="site-title">My Website</a>
            <div>
                <a href="thesis/index.html" class="menu-link">Thesis</a>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <h1>Welcome to My Website</h1>
        <p class="subtitle">A collection of thoughts, projects, and documentation.</p>

        <div class="content-placeholder">
            <p>This is the front page of your new blog. You can add recent posts, an introduction, or links to your latest work here.</p>
            <p><em>Content coming soon...</em></p>
        </div>
    </main>

</body>
</html>
